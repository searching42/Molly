[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai4s-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "httpx>=0.27",
  "jsonschema>=4.23",
  "keyring>=25.0",
  "pillow>=10.0",
  "platformdirs>=4.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pdfplumber>=0.11",
  "pytest>=8.0",
  "rdkit>=2023.9.1",
  "reportlab>=4.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "unit: isolated pure-function, schema, contract, or lightweight verifier coverage",
  "integration: collaboration across API, storage, executor, adapter, or filesystem components",
  "acceptance: user-visible workflow or end-to-end behavior",
  "adversarial: tampering, path, inode, TOCTOU, replay, or fail-closed security coverage",
  "slow: measured high-duration coverage retained for full and scheduled CI",
  "remote_mock: simulated SSH, SCP, remote worker, or external-program execution",
  "pr_fast: curated integration, acceptance, UI, and security canary for pull requests",
]
