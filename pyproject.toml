[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molly"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.23",
]

[project.scripts]
molly = "molly.cli:main"

[project.optional-dependencies]
pdf = [
  "pdfplumber>=0.11",
]
mineru = [
  "mineru[core]==3.4.0",
]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "reportlab>=4.0",
  "wheel>=0.45",
]
observability = [
  "langsmith>=0.4,<1",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.44,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
  "unit: isolated pure-function, schema, contract, or lightweight verifier coverage",
  "integration: collaboration across API, storage, executor, adapter, or filesystem components",
  "acceptance: user-visible workflow or end-to-end behavior",
  "adversarial: tampering, path, inode, TOCTOU, replay, or fail-closed security coverage",
  "slow: measured high-duration coverage retained for full and scheduled CI",
  "remote_mock: simulated SSH, SCP, remote worker, or external-program execution",
  "pr_fast: curated integration, acceptance, UI, and security canary for pull requests",
]
