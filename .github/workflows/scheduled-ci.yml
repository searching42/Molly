name: Scheduled CI

on:
  schedule:
    - cron: "17 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full:
    name: complete suite
    uses: ./.github/workflows/full-ci.yml

  security-replay:
    name: randomized security and remote replay
    needs: full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: random
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Keep historical evidence-generating runner commits available for
          # exact runner-code binding verification in the complete suite.
          fetch-depth: 0

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev,pdf]"

      - name: Repeat adversarial, remote-mock, and slow layers
        run: |
          python -m pytest -q \
            -m "adversarial or remote_mock or slow" \
            --durations=100 \
            --junitxml=pytest-security-replay.xml

      - name: Upload scheduled replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-security-replay-${{ github.run_id }}-${{ github.run_attempt }}
          path: pytest-security-replay.xml
          if-no-files-found: error
          retention-days: 30
