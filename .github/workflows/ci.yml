name: PR Fast CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-fast-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: compile and diff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Validate complete Full CI shard assignment
        run: python scripts/select_test_shard.py --shards 4 --validate

      - name: Check whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  test:
    name: pytest (PR fast)
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The committed M3 evidence binds the immediately preceding runner
          # commit and verifies those exact bytes during pytest.
          fetch-depth: 2

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit layer and reviewed PR canaries
        id: pytest
        shell: bash
        run: |
          set +e
          python -m pytest -q \
            -m "(unit and not slow) or pr_fast" \
            --durations=20 \
            --junitxml=pytest-pr-fast.xml \
            > pytest-pr-fast.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 100 pytest-pr-fast.log
          exit 0

      - name: Upload PR Fast evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-pr-fast-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            pytest-pr-fast.log
            pytest-pr-fast.xml
          if-no-files-found: error
          retention-days: 14

      - name: Enforce pytest result
        if: always()
        shell: bash
        run: |
          status="${{ steps.pytest.outputs.exit_code }}"
          if [ -z "$status" ]; then
            echo "pytest did not report an exit code" >&2
            exit 1
          fi
          exit "$status"
