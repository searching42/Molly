name: Full CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: compile and shard policy
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources and tests
        run: python -m compileall -q src tests

      - name: Validate complete, non-overlapping shard assignment
        run: python scripts/select_test_shard.py --shards 4 --validate

      - name: Check whitespace errors
        shell: bash
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  test:
    name: pytest full (weighted shard ${{ matrix.shard }})
    if: github.event_name != 'pull_request' || github.event.label.name == 'full-ci'
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Evidence verification resolves the exact historical runner commit.
          fetch-depth: 0

      - name: Set up Python with dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Poppler runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run complete weighted test shard
        id: pytest
        shell: bash
        run: |
          set +e
          mapfile -t selected_tests < <(
            python scripts/select_test_shard.py \
              --shards 4 \
              --shard "${{ matrix.shard }}" \
              --validate
          )
          printf 'weighted shard %s selected %s files\n' \
            "${{ matrix.shard }}" "${#selected_tests[@]}" > pytest-full.log
          printf '%s\n' "${selected_tests[@]}" >> pytest-full.log
          timeout --signal=TERM --kill-after=30s 40m \
            python -m pytest -q \
              --durations=50 \
              --junitxml=pytest-full.xml \
              "${selected_tests[@]}" >> pytest-full.log 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          tail -n 120 pytest-full.log
          exit 0

      - name: Upload Full CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          path: |
            pytest-full.log
            pytest-full.xml
          if-no-files-found: error
          retention-days: 21

      - name: Enforce pytest result
        if: always()
        shell: bash
        run: |
          status="${{ steps.pytest.outputs.exit_code }}"
          if [ -z "$status" ]; then
            echo "pytest did not report an exit code" >&2
            exit 1
          fi
          exit "$status"
